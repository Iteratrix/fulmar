[package]
name = "fulmar"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A complete Bluesky / AT Protocol CLI: full DM cycle, cursors everywhere, lock-safe sessions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Iteratrix/fulmar"
publish = false

[workspace]
exclude = ["reference"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
etcetera = "0.11"
futures = "0.3"
image = "0.25"
psl = "2"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
trycmd = "1"
wiremock = "0.6"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "allow"
print_stderr = "allow"

[profile.dist]
inherits = "release"
lto = "thin"
